name: Handbook quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check handbook contracts
        run: python3 tools/check.py
      - name: Test checker behavior
        run: python3 -m unittest discover -s tests -v
      - name: Test specimen state transitions
        run: node --test tests/specimen-model.test.cjs
