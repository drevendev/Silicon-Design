name: Handbook quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # Verify optional-depth digests against their actual pinned Git blobs.
      - name: Install verification dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Check handbook contracts
        run: python3 tools/check.py
      - name: Test checker behavior
        run: python3 -m unittest discover -s tests -v
      - name: Test specimen state transitions
        run: node --test tests/specimen-model.test.cjs tests/field-notes.test.js
      - name: Validate activation corpus without model calls
        run: python3 tools/activation.py validate
