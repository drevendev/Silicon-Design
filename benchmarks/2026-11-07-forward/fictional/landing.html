<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Repair co-op — static prototype</title>
<style>
:root{color-scheme:light;--paper:#f5edd9;--ink:#213c2d;--action:#28513b;--line:#6c806b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:20px/1.55 Arial,sans-serif}.page{min-height:100svh;max-width:1440px;margin:auto;padding:56px 6vw 28px;display:flex;flex-direction:column}.workbench{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.85fr);column-gap:8%;align-items:end;border-top:12px solid var(--action);border-bottom:2px solid var(--action);padding:54px 0 58px;margin:auto 0}h1{font:normal clamp(54px,6vw,88px)/1.04 Georgia,serif;letter-spacing:-.035em;max-width:12ch;margin:0;text-wrap:balance}.invitation{padding-top:22px;border-top:2px solid var(--action)}p{margin:0 0 30px;max-width:31ch}button{display:block;width:100%;min-height:58px;border:1px solid var(--action);background:var(--action);color:#fff;padding:16px 22px;text-align:left;font:bold 18px/1.4 Arial,sans-serif;cursor:pointer}button:focus-visible{outline:3px solid #124f82;outline-offset:5px}footer{font-size:16px;padding-top:24px;margin-top:34px}@media(max-width:720px){.page{padding:24px;min-height:100svh}.workbench{grid-template-columns:1fr;gap:32px;border-top-width:8px;padding:34px 0;margin:0}h1{font-size:clamp(44px,10vw,66px);max-width:12ch}.invitation{padding-top:24px}p{font-size:18px;margin-bottom:24px;max-width:33ch}button{font-size:17px}footer{margin-top:auto;padding-top:28px;font-size:15px}}@media(max-width:360px){.page{padding:20px}h1{font-size:44px}}
</style>
<div class="page"><main class="workbench"><h1>A second life for everyday things</h1><div class="invitation"><p>Bring a small electrical item. We inspect it together and explain the next step.</p><button type="button">Book a repair table</button></div></main><footer>Saturday, 10:00–16:00 · South Hall</footer></div>
</html>
