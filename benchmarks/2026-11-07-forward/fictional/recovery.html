<!doctype html><html lang="en"><meta charset="utf-8"><title>Recovery controls</title><style>body{font:17px/1.5 system-ui;margin:30px;color:#20332d;background:#faf8f1}button,input{font:inherit;padding:12px}button:focus-visible,input:focus-visible{outline:3px solid #005ac6;outline-offset:3px}article{padding:20px;border:1px solid;margin:16px 0;max-width:600px}dialog{max-width:500px}.cards{display:flex;align-items:flex-start;gap:16px}</style><h1>Fictional repair queue</h1><label>Search <input id="search"></label><button id="mode">Compact view</button><div id="list"><article id="job"><h2>N-101 · Radio</h2><p>Retain the search and meaningful destination after removing the last job.</p><button id="inspect">Inspect N-101</button></article></div><p id="status" role="status"></p><button id="undo" hidden>Undo removal</button><dialog id="detail"><h2>N-101 · Radio</h2><button id="close">Close details</button><button id="remove">Remove job</button></dialog><div class="cards"><article><h2>Today</h2>Three repairs.</article><article><h2>Handover</h2>Different heights are deliberate.<p>Packaging and cable need inspection before collection.</p></article></div><script>const q=s=>document.querySelector(s),dialog=q('#detail');const open=()=>dialog.showModal();q('#inspect').onclick=open;q('#close').onclick=()=>{dialog.close();q('#inspect').focus()};q('#remove').onclick=()=>{dialog.close();q('#job').hidden=true;q('#undo').hidden=false;q('#status').textContent='N-101 removed. Undo is available.';q('#undo').focus()};q('#undo').onclick=()=>{q('#job').hidden=false;q('#undo').hidden=true;q('#status').textContent='N-101 restored.';q('#inspect').focus()};q('#mode').onclick=()=>{q('#list').style.maxWidth=q('#list').style.maxWidth?'':'440px';q('#mode').textContent=q('#list').style.maxWidth?'Comfortable view':'Compact view'};dialog.oncancel=()=>q('#inspect').focus();</script></html>
